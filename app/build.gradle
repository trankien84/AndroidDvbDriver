plugins {
    id 'com.android.application'
}

android {
    namespace = 'info.martinmarinov.dvbdriver'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = "info.martinmarinov.dvbdriver"
        minSdk = 21
        targetSdk = 37
        versionCode = 30
        versionName = "1.44"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            def sourceSha = providers.exec {
                workingDir rootProject.projectDir
                commandLine 'git', 'rev-parse', 'HEAD'
            }.standardOutput.asText.get().trim()
            if (!(sourceSha ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid source Git SHA')
            buildConfigField 'String', 'SOURCE_GIT_SHA', '"' + sourceSha + '"'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    sourceSets {
        // The same merged-manifest/resource contract runs against both packaged variants.
        testDebug.java.srcDir 'src/testRelease/java'
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def mergedManifest = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
        def apkDirectory = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
        def aapt2 = sdkComponents.aapt2.flatMap { it.executable }
        tasks.withType(Test).configureEach { test ->
            if (test.name == "test${variantName.capitalize()}UnitTest") {
                test.dependsOn(mergedManifest, apkDirectory)
                test.inputs.file(mergedManifest).withPropertyName('usbAttachMergedManifest')
                test.inputs.dir(apkDirectory).withPropertyName('usbAttachPackagedResources')
                test.inputs.file(aapt2).withPropertyName('usbAttachAapt2')
                test.doFirst {
                    test.systemProperty 'tbs5530.manifest', mergedManifest.get().asFile.absolutePath
                    test.systemProperty 'tbs5530.apkDir', apkDirectory.get().asFile.absolutePath
                    test.systemProperty 'tbs5530.aapt2', aapt2.get().asFile.absolutePath
                    test.systemProperty 'tbs5530.variant', variantName
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation project(path: ':usbxfer')
    implementation project(path: ':usbxfer')
    implementation project(path: ':drivers')
    implementation project(path: ':dvbservice')
}